definitions:
  handler.LoginReq:
    properties:
      password:
        maxLength: 64
        minLength: 6
        type: string
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  handler.LoginResp:
    properties:
      accessExpiresIn:
        description: 访问令牌有效期（秒）
        type: integer
      accessToken:
        type: string
      refreshExpiresIn:
        description: 刷新令牌有效期（秒）
        type: integer
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/handler.UserInfo'
    type: object
  handler.OtherInStockItemReq:
    properties:
      price:
        type: number
      productId:
        type: integer
      quantity:
        type: number
      remark:
        type: string
    required:
    - productId
    - quantity
    type: object
  handler.OtherInStockSaveReq:
    properties:
      billDate:
        type: string
      businessManagerId:
        type: integer
      complete:
        description: true=保存并过账
        type: boolean
      counterpart:
        type: string
      deptId:
        type: integer
      handlerId:
        type: integer
      inType:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.OtherInStockItemReq'
        minItems: 1
        type: array
      remark:
        type: string
      settleUnit:
        type: string
      warehouseId:
        type: integer
    required:
    - billDate
    - inType
    - items
    - warehouseId
    type: object
  handler.OtherOutStockItemReq:
    properties:
      price:
        type: number
      productId:
        type: integer
      quantity:
        type: number
      remark:
        type: string
    required:
    - productId
    - quantity
    type: object
  handler.OtherOutStockSaveReq:
    properties:
      billDate:
        type: string
      complete:
        type: boolean
      counterpart:
        type: string
      deptId:
        type: integer
      handlerId:
        type: integer
      items:
        items:
          $ref: '#/definitions/handler.OtherOutStockItemReq'
        minItems: 1
        type: array
      outType:
        type: string
      remark:
        type: string
      settleUnit:
        type: string
      warehouseId:
        type: integer
    required:
    - billDate
    - items
    - outType
    - warehouseId
    type: object
  handler.RefreshReq:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  handler.StockLimitReq:
    properties:
      maxStock:
        type: number
      minStock:
        type: number
      productIds:
        items:
          type: integer
        type: array
    required:
    - productIds
    type: object
  handler.UserInfo:
    properties:
      deptId:
        type: integer
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      roleId:
        type: integer
      username:
        type: string
    type: object
  handler.wecomCodeReq:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
info:
  contact: {}
