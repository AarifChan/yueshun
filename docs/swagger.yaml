  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录，返回 JWT 令牌
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.LoginResp'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - 认证
  /api/v1/auth/logout:
    post:
      description: 清除当前登录状态
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 认证
  /api/v1/auth/me:
    get:
      description: 根据 JWT 获取登录用户信息
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.UserInfo'
              type: object
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - 认证
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 RefreshToken 获取新的 AccessToken（同时轮换 RefreshToken）
      parameters:
      - description: 刷新参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.LoginResp'
              type: object
      summary: 刷新访问令牌
      tags:
      - 认证
  /api/v1/auth/wecom/config:
    get:
      description: 返回 corpid/agentId/inviteQrUrl/redirectHost 供登录页使用（不含 secret）
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 企业微信登录配置
      tags:
      - 认证
  /api/v1/auth/wecom/mp:
    post:
      consumes:
      - application/json
      description: getPhoneNumber code → 手机号 → 校验企业成员身份 → 绑定/签发 JWT
      parameters:
      - description: 手机号授权码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.wecomCodeReq'
      produces:
