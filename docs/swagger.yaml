              type: object
      summary: 小程序企业微信登录
      tags:
      - 认证
  /api/v1/auth/wecom/web:
    post:
      consumes:
      - application/json
      description: WWLogin 授权 code → 成员 userid → 详情(手机号) → 绑定/签发 JWT
      parameters:
      - description: 扫码授权码
        in: body
