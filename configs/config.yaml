app:
  name: "zhizhang-server"
  version: "1.0.0"
  env: "dev"  # dev | test | prod
  port: 8388

jwt:
  secret: "change-me-in-production"
  access_ttl: 7200      # 2 hours (seconds)
  refresh_ttl: 604800 # 7 days (seconds)

database:
  driver: "postgres"
  host: "localhost"
  port: 5432
  database: "zhizhang"
  username: "postgres"
  password: "postgres"
  charset: "utf8mb4"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 3600 # seconds
  log_level: "info" # silent | error | warn | info

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10

log:
  level: "debug" # debug | info | warn | error
  format: "json" # json | console
  output: "stdout" # stdout | file

pagination:
  default_page_size: 20
  max_page_size: 500

upload:
  dir: "./uploads" # 图片上传保存目录

# 企业微信（自建应用）—— 真实值一律用环境变量注入，勿写进仓库（见 docs/wecom-setup.md）
wecom:
  corpid: ""
  agentid: 0
  secret: ""
  invite_qr_url: ""
  redirect_host: ""

# 微信小程序 —— 真实值一律用环境变量注入
wechat_mp:
  appid: ""
  secret: ""
