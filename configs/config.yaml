app:
  name: "zhizhang-server"
  version: "1.0.0"
  env: "dev"  # dev | test | prod
  port: 8388

jwt:
  secret: "change-me-in-production"
  access_ttl: 7200      # 2 hours (seconds)
  refresh_ttl: 604800 # 7 days (seconds)

database:
  driver: "postgres"
  host: "localhost"
  port: 5432
  database: "zhizhang"
  username: "postgres"
  password: "postgres"
  charset: "utf8mb4"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 3600 # seconds
  log_level: "info" # silent | error | warn | info

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10

# 企业微信扫码登录（需在 企业微信管理后台-应用管理 中创建自建应用）
wecom:
  enabled: false            # 配置完整后改为 true
  corp_id: ""               # 企业ID
  agent_id: ""              # 自建应用 AgentId
  secret: ""                # 自建应用 Secret
  redirect_url: ""          # 授权回调地址，如 https://你的域名/api/v1/auth/wecom/callback

log:
  level: "debug" # debug | info | warn | error
  format: "json" # json | console
  output: "stdout" # stdout | file

pagination:
  default_page_size: 20
  max_page_size: 500

upload:
  dir: "./uploads" # 图片上传保存目录
